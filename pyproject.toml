[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicshield-ai"
version = "0.1.0"
description = "Public-safety and disaster-risk portfolio demonstration (NOT an emergency service)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "pytest-cov>=5,<8"]
explain = ["shap>=0.46,<1"]
tracking = ["mlflow>=2.15,<4"]

[tool.setuptools]
packages = ["backend", "backend.app", "civicshield", "civicshield.ml", "civicshield.assistant", "civicshield.incident_management", "civicshield.monitoring", "civicshield.ingestion", "civicshield.data_processing"]

[tool.setuptools.package-dir]
civicshield = "src/civicshield"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
