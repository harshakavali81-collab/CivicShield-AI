services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicshield
      POSTGRES_USER: civicshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_a_strong_POSTGRES_PASSWORD_in_your_gitignored_.env}
    volumes:
      - civicshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicshield"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://civicshield:${POSTGRES_PASSWORD:?Set_a_strong_POSTGRES_PASSWORD_in_your_gitignored_.env}@db:5432/civicshield
      INCIDENT_SUBMISSIONS_ENABLED: ${INCIDENT_SUBMISSIONS_ENABLED:-false}
      RESPONDER_API_KEY: ${RESPONDER_API_KEY:-}
      REPORTER_API_KEY: ${REPORTER_API_KEY:-}
      OPEN_METEO_ENABLED: ${OPEN_METEO_ENABLED:-false}
      GEOSPATIAL_BACKEND: ${GEOSPATIAL_BACKEND:-portable}
      APP_ENV: local
      CIVICSHIELD_MODEL_PATH: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: frontend
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
volumes:
  civicshield_pg:
