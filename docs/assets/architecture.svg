<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">CivicShield AI component overview</title>
<desc id="desc">Validated user data goes through a freshness gate, experimental risk logic, FastAPI and the React dashboard; reports are handled separately and reviewed by humans.</desc>
