<text x="337" y="158" fill="#234b7d">Validate and</text><text x="337" y="181" fill="#234b7d">check freshness</text>
<rect x="467" y="122" width="170" height="92" rx="13" fill="#fff2dd" stroke="#d5a95c"/>
<text x="552" y="156" fill="#805614">Experimental risk</text><text x="552" y="180" font-size="13" fill="#805614">Never official</text>
<rect x="680" y="122" width="170" height="92" rx="13" fill="#e9f7ed" stroke="#80c998"/>
<text x="765" y="156" fill="#246c40">FastAPI + SQL</text><text x="765" y="180" font-size="13" fill="#4c8564">Human report review</text>
