<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="525" viewBox="0 0 1280 525" role="img" aria-label="Official source and weather provenance overview"><title>Official source and weather provenance overview</title><defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset=".56" stop-color="#102A50"/><stop offset="1" stop-color="#081B35"/></linearGradient>
<linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21C7CA"/><stop offset="1" stop-color="#5084FF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#355EE8"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#2ED9BA"/><stop offset="1" stop-color="#1EA77D"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#F9BF72"/><stop offset="1" stop-color="#E98847"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172E52"/><stop offset="1" stop-color="#101F39"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="25"/></filter>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#000814" flood-opacity=".35"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0 H0 V42" fill="none" stroke="#5794C8" stroke-width="1" opacity=".13"/></pattern>
</defs><rect x="0" y="0" width="1280" height="525" rx="0" fill="url(#night)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1280" height="525" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/><text x="49" y="71" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="810" fill="#F0FAFF" >Know the source. Know the limits.</text><text x="51" y="107" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="540" fill="#AFC8E3" >CivicShield keeps source status visible rather than inventing warnings.</text><rect x="43" y="160" width="385" height="272" rx="18" fill="#122C49" stroke="#63B1FF" stroke-width="1.7"/><rect x="67" y="183" width="337" height="38" rx="10" fill="#173A59" stroke="none" stroke-width="1"/><circle cx="86" cy="202" r="7" fill="#63B1FF"/><text x="104" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="790" fill="#63B1FF" >OPTIONAL ADAPTER</text><text x="65" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#EBF8FF" >IMD district advisories</text><circle cx="71" cy="303" r="4" fill="#63B1FF"/><text x="86" y="309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Official IMD response parsing</text><circle cx="71" cy="341" r="4" fill="#63B1FF"/><text x="86" y="347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Needs permitted API access</text><circle cx="71" cy="379" r="4" fill="#63B1FF"/><text x="86" y="385" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Unknown if disconnected</text><rect x="456" y="160" width="385" height="272" rx="18" fill="#122C49" stroke="#F7C27C" stroke-width="1.7"/><rect x="480" y="183" width="337" height="38" rx="10" fill="#173A59" stroke="none" stroke-width="1"/><circle cx="499" cy="202" r="7" fill="#F7C27C"/><text x="517" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="790" fill="#F7C27C" >EXTERNAL LINKS ONLY</text><text x="478" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#EBF8FF" >CWC flood forecasts</text><circle cx="484" cy="303" r="4" fill="#F7C27C"/><text x="499" y="309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Reference official CWC sites</text><circle cx="484" cy="341" r="4" fill="#F7C27C"/><text x="499" y="347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >No machine feed configured</text><circle cx="484" cy="379" r="4" fill="#F7C27C"/><text x="499" y="385" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Never infer no warnings</text><rect x="869" y="160" width="385" height="272" rx="18" fill="#122C49" stroke="#57DECA" stroke-width="1.7"/><rect x="893" y="183" width="337" height="38" rx="10" fill="#173A59" stroke="none" stroke-width="1"/><circle cx="912" cy="202" r="7" fill="#57DECA"/><text x="930" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="790" fill="#57DECA" >MODELED DATA</text><text x="891" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#EBF8FF" >Open-Meteo weather</text><circle cx="897" cy="303" r="4" fill="#57DECA"/><text x="912" y="309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Opt-in third-party estimates</text><circle cx="897" cy="341" r="4" fill="#57DECA"/><text x="912" y="347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Not government bulletins</text><circle cx="897" cy="379" r="4" fill="#57DECA"/><text x="912" y="385" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="530" fill="#B8D2E9" >Attribution + timestamp</text><rect x="43" y="461" width="1207" height="39" rx="9" fill="#483326" stroke="none" stroke-width="1"/><text x="65" y="487" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#FFE2BC" >Disconnected provider ≠ safe area   •   Modeled weather ≠ observed rainfall   •   Research dashboard ≠ emergency service</text></svg>