<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="630" viewBox="0 0 1360 630" role="img" aria-label="Experimental machine learning research evaluation flow"><title>Experimental machine learning research evaluation flow</title><defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset=".56" stop-color="#102A50"/><stop offset="1" stop-color="#081B35"/></linearGradient>
<linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21C7CA"/><stop offset="1" stop-color="#5084FF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#355EE8"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#2ED9BA"/><stop offset="1" stop-color="#1EA77D"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#F9BF72"/><stop offset="1" stop-color="#E98847"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172E52"/><stop offset="1" stop-color="#101F39"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="25"/></filter>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#000814" flood-opacity=".35"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0 H0 V42" fill="none" stroke="#5794C8" stroke-width="1" opacity=".13"/></pattern>
</defs><rect x="0" y="0" width="1360" height="630" rx="0" fill="url(#night)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1360" height="630" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/><text x="55" y="74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="800" fill="#F3FAFF" >Model evaluation — research only</text><text x="56" y="109" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="530" fill="#AAC5DF" >Built for reproducibility, not unsubstantiated real-world disaster prediction accuracy.</text><rect x="46" y="193" width="245" height="149" rx="15" fill="#122B4A" stroke="#487CAC" stroke-width="1.8"/><rect x="60" y="209" width="34" height="34" rx="10" fill="#3776D2" stroke="none" stroke-width="1"/><text x="71" y="233" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFF" >1</text><text x="61" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="710" fill="#E8F4FF" >Licensed labeled data</text><text x="61" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A6C3E1" >No training data shipped</text><line x1="293" y1="263" x2="310" y2="263" stroke="#6CBECE" stroke-width="2" opacity="1" stroke-linecap="round"/><path d="M308 263 l-7 -5 v10 z" fill="#6CBECE"/><rect x="312" y="193" width="245" height="149" rx="15" fill="#122B4A" stroke="#487CAC" stroke-width="1.8"/><rect x="326" y="209" width="34" height="34" rx="10" fill="#3776D2" stroke="none" stroke-width="1"/><text x="337" y="233" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFF" >2</text><text x="327" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="710" fill="#E8F4FF" >Input quality gate</text><text x="327" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A6C3E1" >Validate dates and classes</text><line x1="559" y1="263" x2="576" y2="263" stroke="#6CBECE" stroke-width="2" opacity="1" stroke-linecap="round"/><path d="M574 263 l-7 -5 v10 z" fill="#6CBECE"/><rect x="578" y="193" width="245" height="149" rx="15" fill="#122B4A" stroke="#487CAC" stroke-width="1.8"/><rect x="592" y="209" width="34" height="34" rx="10" fill="#3776D2" stroke="none" stroke-width="1"/><text x="603" y="233" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFF" >3</text><text x="593" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="710" fill="#E8F4FF" >Time + district split</text><text x="593" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A6C3E1" >Prevent obvious leakage</text><line x1="825" y1="263" x2="842" y2="263" stroke="#6CBECE" stroke-width="2" opacity="1" stroke-linecap="round"/><path d="M840 263 l-7 -5 v10 z" fill="#6CBECE"/><rect x="844" y="193" width="245" height="149" rx="15" fill="#122B4A" stroke="#487CAC" stroke-width="1.8"/><rect x="858" y="209" width="34" height="34" rx="10" fill="#3776D2" stroke="none" stroke-width="1"/><text x="869" y="233" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFF" >4</text><text x="859" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="710" fill="#E8F4FF" >Holdout evaluation</text><text x="859" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A6C3E1" >False negatives • Brier score</text><line x1="1091" y1="263" x2="1108" y2="263" stroke="#6CBECE" stroke-width="2" opacity="1" stroke-linecap="round"/><path d="M1106 263 l-7 -5 v10 z" fill="#6CBECE"/><rect x="1110" y="193" width="245" height="149" rx="15" fill="#122B4A" stroke="#D59867" stroke-width="1.8"/><rect x="1124" y="209" width="34" height="34" rx="10" fill="#DFAD7B" stroke="none" stroke-width="1"/><text x="1135" y="233" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFF" >5</text><text x="1125" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="710" fill="#E8F4FF" >Independent approval</text><text x="1125" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A6C3E1" >Expert review outstanding</text><rect x="50" y="386" width="802" height="170" rx="14" fill="#102948" stroke="#365D85" stroke-width="1"/><text x="72" y="421" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#E7F5FF" >Evaluation report sections</text><rect x="72" y="442" width="236" height="82" rx="9" fill="#1A3758" stroke="none" stroke-width="1"/><text x="86" y="471" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="760" fill="#BDEBFF" >Confusion matrix</text><text x="86" y="497" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A0BAD4" >Counts after running training</text><rect x="329" y="442" width="236" height="82" rx="9" fill="#1A3758" stroke="none" stroke-width="1"/><text x="343" y="471" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="760" fill="#BDEBFF" >False negative rate</text><text x="343" y="497" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A0BAD4" >Sensitive error to inspect</text><rect x="586" y="442" width="236" height="82" rx="9" fill="#1A3758" stroke="none" stroke-width="1"/><text x="600" y="471" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="760" fill="#BDEBFF" >Held-out districts</text><text x="600" y="497" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#A0BAD4" >Assess geographic shift</text><rect x="885" y="386" width="423" height="170" rx="14" fill="#473126" stroke="#C08453" stroke-width="1.6"/><text x="911" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="830" fill="#FFE0AA" >NOT CERTIFIED</text><text x="911" y="460" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" fill="#FFEACC" >No verified forecasting accuracy</text><text x="911" y="491" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" fill="#FFEACC" >No government approval</text><text x="911" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="530" fill="#FFD5A5" >Requires real events + expert review</text></svg>