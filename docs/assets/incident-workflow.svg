<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="582" viewBox="0 0 1360 582" role="img" aria-label="Incident moderation and human decision workflow"><title>Incident moderation and human decision workflow</title><defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset=".56" stop-color="#102A50"/><stop offset="1" stop-color="#081B35"/></linearGradient>
<linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21C7CA"/><stop offset="1" stop-color="#5084FF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#355EE8"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#2ED9BA"/><stop offset="1" stop-color="#1EA77D"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#F9BF72"/><stop offset="1" stop-color="#E98847"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172E52"/><stop offset="1" stop-color="#101F39"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="25"/></filter>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#000814" flood-opacity=".35"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0 H0 V42" fill="none" stroke="#5794C8" stroke-width="1" opacity=".13"/></pattern>
</defs><rect x="0" y="0" width="1360" height="582" rx="0" fill="url(#night)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1360" height="582" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/><text x="50" y="75" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="810" fill="#F2FAFF" >Citizen incident workflow</text><text x="52" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="520" fill="#AAC5E3" >A report is a review request — never a confirmed hazard or emergency dispatch.</text><rect x="49" y="198" width="232" height="158" rx="18" fill="#132F50" stroke="#459BFF" stroke-width="2"/><rect x="70" y="220" width="43" height="43" rx="14" fill="#459BFF" stroke="none" stroke-width="1"/><text x="85" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850" fill="#07162B" >1</text><text x="69" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#F6FAFF" >Incident report</text><text x="69" y="323" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="510" fill="#AFCBE1" >Local opt-in form</text><rect x="315" y="198" width="232" height="158" rx="18" fill="#132F50" stroke="#25C3B3" stroke-width="2"/><rect x="336" y="220" width="43" height="43" rx="14" fill="#25C3B3" stroke="none" stroke-width="1"/><text x="351" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850" fill="#07162B" >2</text><text x="335" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#F6FAFF" >Validate + redact</text><text x="335" y="323" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="510" fill="#AFCBE1" >Basic contact filtering</text><rect x="581" y="198" width="232" height="158" rx="18" fill="#132F50" stroke="#F6B467" stroke-width="2"/><rect x="602" y="220" width="43" height="43" rx="14" fill="#F6B467" stroke="none" stroke-width="1"/><text x="617" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850" fill="#07162B" >3</text><text x="601" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#F6FAFF" >Classify + flag</text><text x="601" y="323" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="510" fill="#AFCBE1" >Duplicate / priority hint</text><rect x="847" y="198" width="232" height="158" rx="18" fill="#132F50" stroke="#6596FF" stroke-width="2"/><rect x="868" y="220" width="43" height="43" rx="14" fill="#6596FF" stroke="none" stroke-width="1"/><text x="883" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850" fill="#07162B" >4</text><text x="867" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#F6FAFF" >Authorized queue</text><text x="867" y="323" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="510" fill="#AFCBE1" >OIDC or local demo</text><line x1="282" y1="278" x2="313" y2="278" stroke="#8EC3F1" stroke-width="4" opacity="1" stroke-linecap="round"/><path d="M313 278 l-10 -7 v14 z" fill="#8EC3F1"/><line x1="548" y1="278" x2="579" y2="278" stroke="#8EC3F1" stroke-width="4" opacity="1" stroke-linecap="round"/><path d="M579 278 l-10 -7 v14 z" fill="#8EC3F1"/><line x1="814" y1="278" x2="845" y2="278" stroke="#8EC3F1" stroke-width="4" opacity="1" stroke-linecap="round"/><path d="M845 278 l-10 -7 v14 z" fill="#8EC3F1"/><line x1="1079" y1="277" x2="1184" y2="277" stroke="#81D6DE" stroke-width="4" opacity="1" stroke-linecap="round"/><path d="M1185 277 l-12 -8 v16 z" fill="#81D6DE"/><rect x="1160" y="226" width="171" height="103" rx="14" fill="#215347" stroke="#58D4B4" stroke-width="1.8"/><text x="1176" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="810" fill="#E2FFF4" >HUMAN</text><text x="1176" y="287" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="790" fill="#E2FFF4" >decision</text><text x="1176" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="540" fill="#A6E1D4" >no automation</text><rect x="78" y="427" width="325" height="63" rx="12" fill="#142C47" stroke="#528CE9" stroke-width="1.6"/><circle cx="102" cy="458" r="8" fill="#528CE9"/><text x="120" y="464" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="710" fill="#E8F5FF" >Needs information</text><rect x="452" y="427" width="325" height="63" rx="12" fill="#142C47" stroke="#E2A56D" stroke-width="1.6"/><circle cx="476" cy="458" r="8" fill="#E2A56D"/><text x="494" y="464" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="710" fill="#E8F5FF" >Dismissed</text><rect x="824" y="427" width="325" height="63" rx="12" fill="#142C47" stroke="#39C29E" stroke-width="1.6"/><circle cx="848" cy="458" r="8" fill="#39C29E"/><text x="866" y="464" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="710" fill="#E8F5FF" >Demo-reviewed</text><rect x="55" y="517" width="1254" height="39" rx="9" fill="#4B352D" stroke="none" stroke-width="1"/><text x="74" y="543" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFE2C2" >IMPORTANT: Reviewer status is not government verification. No automatic public warning, rescue or evacuation is ever issued.</text></svg>