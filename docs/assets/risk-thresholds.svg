<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="495" viewBox="0 0 1250 495" role="img" aria-label="Illustrative rainfall threshold grouping, not a flood forecast"><title>Illustrative rainfall threshold grouping, not a flood forecast</title><defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset=".56" stop-color="#102A50"/><stop offset="1" stop-color="#081B35"/></linearGradient>
<linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21C7CA"/><stop offset="1" stop-color="#5084FF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#355EE8"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#2ED9BA"/><stop offset="1" stop-color="#1EA77D"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#F9BF72"/><stop offset="1" stop-color="#E98847"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172E52"/><stop offset="1" stop-color="#101F39"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="25"/></filter>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#000814" flood-opacity=".35"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0 H0 V42" fill="none" stroke="#5794C8" stroke-width="1" opacity=".13"/></pattern>
</defs><rect x="0" y="0" width="1250" height="495" rx="0" fill="url(#night)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1250" height="495" rx="0" fill="url(#grid)" stroke="none" stroke-width="1"/><text x="46" y="71" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="810" fill="#F4FAFF" >How the demo indicator works</text><text x="48" y="107" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#B8CDE4" >Rainfall-only educational thresholds from the existing codebase — NOT official IMD/CWC warning bands.</text><rect x="48" y="162" width="267" height="180" rx="15" fill="#122B48" stroke="#42D6B0" stroke-width="1.8"/><rect x="61" y="178" width="241" height="13" rx="5" fill="#42D6B0" stroke="none" stroke-width="1"/><text x="67" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#EAF5FF" >&lt; 30 mm</text><text x="67" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#42D6B0" >Lower indicator</text><text x="67" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#A9C6DE" >Does not mean safe</text><rect x="328" y="162" width="267" height="180" rx="15" fill="#122B48" stroke="#68ADFF" stroke-width="1.8"/><rect x="341" y="178" width="241" height="13" rx="5" fill="#68ADFF" stroke="none" stroke-width="1"/><text x="347" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#EAF5FF" >30–64.9 mm</text><text x="347" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#68ADFF" >Elevated</text><text x="347" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#A9C6DE" >Illustrative grouping</text><rect x="608" y="162" width="267" height="180" rx="15" fill="#122B48" stroke="#F5B15C" stroke-width="1.8"/><rect x="621" y="178" width="241" height="13" rx="5" fill="#F5B15C" stroke="none" stroke-width="1"/><text x="627" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#EAF5FF" >65–114.9 mm</text><text x="627" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#F5B15C" >High</text><text x="627" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#A9C6DE" >Not a flood forecast</text><rect x="888" y="162" width="313" height="180" rx="15" fill="#122B48" stroke="#EF8580" stroke-width="1.8"/><rect x="901" y="178" width="287" height="13" rx="5" fill="#EF8580" stroke="none" stroke-width="1"/><text x="907" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#EAF5FF" >≥ 115 mm</text><text x="907" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#EF8580" >Very high</text><text x="907" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#A9C6DE" >Not evacuation guidance</text><rect x="48" y="372" width="1153" height="73" rx="12" fill="#56382D" stroke="#CC8C57" stroke-width="1.5"/><text x="69" y="401" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="820" fill="#FFDAB4" >SOURCE FRESHNESS GATE</text><text x="69" y="429" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="520" fill="#FBEADA" >Weather inputs older than 6 hours → UNAVAILABLE. No amount of low demo rainfall confirms real-world safety.</text></svg>