# Template only; provision account, OIDC and secrets separately.
databases:
  - name: civicshield-db
    databaseName: civicshield
    user: civicshield
    plan: 0.5c-1g
    ipAllowList: []
services:
  - type: web
    name: civicshield-api
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: oidc
      - key: DATABASE_URL
        fromDatabase:
          name: civicshield-db
          property: connectionString
      - key: INCIDENT_SUBMISSIONS_ENABLED
        value: "false"
      - key: OPEN_METEO_ENABLED
        value: "false"
      - key: IMD_API_ENABLED
        value: "false"
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUDIT_HASH_SECRET
        generateValue: true
  - type: web
    name: civicshield-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: off
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_AUTH_MODE
        value: oidc
      - key: VITE_OIDC_AUTHORITY
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      - key: VITE_OIDC_SCOPE
        sync: false
