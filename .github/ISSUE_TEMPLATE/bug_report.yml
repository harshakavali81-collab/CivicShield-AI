name: Engineering bug report
description: Report a reproducible software bug without private incident or hazard data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        This is a portfolio research project, not an emergency service.
        Do not include personal reports, credential values, secret files, or real emergency situations.
        Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual software behavior
      description: Provide deterministic steps with only fictional/synthetic test data.
      placeholder: "When I run the local demo..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, test fixture and error output with credentials removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.12, Node 20, Docker ..."
