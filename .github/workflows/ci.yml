name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev,migrations]"
      - name: Compile Python
        run: python -m compileall -q backend src
      - name: Run tests
        run: pytest -q
      - name: Audit static GitHub Pages site and canonical offline data
        run: |
          python scripts/verify_site.py
          python -m scripts.export_static_demo --check
      - name: Validate managed-cloud Blueprint fail-closed configuration
        run: python -m scripts.validate_blueprint
      - name: Migration smoke test (fresh SQLite)
        run: |
          DATABASE_URL=sqlite:///./migration_ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./migration_ci.db alembic current
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        working-directory: frontend
        run: npm run build
  postgis-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: civicshield_ci
          POSTGRES_USER: civicshield_ci
          POSTGRES_PASSWORD: local_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicshield_ci -d civicshield_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://civicshield_ci:local_ci_only_password@localhost:5432/civicshield_ci
      CI_POSTGIS_TEST: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration and application dependencies
        run: python -m pip install -e ".[dev,migrations]"
      - name: Migrate real PostgreSQL schema
        run: alembic upgrade head
      - name: Exercise PostGIS geography index and search
        run: python -m scripts.verify_postgis
  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose configuration (CI-only credential)
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
        run: docker compose config --quiet
      - name: Build Python API image including migration assets
        run: docker build -f backend/Dockerfile -t civicshield-api-ci .
      - name: Build nginx + React image
        run: docker build -f frontend/Dockerfile -t civicshield-web-ci frontend
  full-stack-acceptance:
    name: Docker Compose end-to-end acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: github-ci-disposable-demo-password-only
      INCIDENT_SUBMISSIONS_ENABLED: "false"
      OPEN_METEO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start integrated DB, API, Nginx and React
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify all three services and Nginx-to-API proxy
        run: |
          docker compose ps
          python scripts/smoke_compose.py --base http://127.0.0.1:5173 --require-empty-db
      - name: Set up Node for headless browser acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright test runner and Chromium
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify real dashboard interactions in Chromium
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Upload browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: civicshield-browser-failure
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=180
      - name: Stop isolated stack and remove ephemeral DB volume
        if: always()
        run: docker compose down --volumes --remove-orphans
  offline-portfolio-package:
    name: Downloadable static portfolio archive
    runs-on: ubuntu-latest
    needs: [api-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Create deterministic standalone portfolio ZIP + SHA-256
        run: python -m scripts.package_portfolio --output dist/portfolio
      - name: Publish downloadable GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civicshield-offline-portfolio-v0.2.0
          path: |
            dist/portfolio/*.zip
            dist/portfolio/*.sha256
          if-no-files-found: error
          retention-days: 30
