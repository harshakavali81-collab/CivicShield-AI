name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev,migrations]"
      - name: Compile Python
        run: python -m compileall -q backend src
      - name: Run tests
        run: pytest -q
      - name: Migration smoke test (fresh SQLite)
        run: |
          DATABASE_URL=sqlite:///./migration_ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./migration_ci.db alembic current
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        working-directory: frontend
        run: npm run build
