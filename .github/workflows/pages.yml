# Manually publish informational site/ ONLY, after Pages settings enabled.
name: Publish static portfolio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit static site before publishing
        run: |
          python scripts/verify_site.py
          python -m scripts.export_static_demo --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy static site
        uses: actions/deploy-pages@v4
        id: publish
